[project]
name = "antipiracy-contracts"
version = "1.1.0"
description = "Versioned V2 contracts: IDs, domain models and events (ADR-007, ADR-010)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13,<3",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/antipiracy_contracts"]
