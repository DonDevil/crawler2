[project]
name = "crawler2"
version = "0.0.1"
description = "Anti-piracy crawler V2"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.15,<3",
    "structlog>=26.1,<27",
    "prometheus-client>=0.26,<1",
    "redis>=8.1,<9",
    "scylla-driver>=3.29.12,<4",
    "antipiracy-contracts",
]

[project.scripts]
crawler2-check = "crawler2.diagnostics.connectivity:main"
crawler2-storage = "crawler2.storage.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1,<10",
    "hypothesis>=6.168,<7",
    "ruff>=0.16,<1",
    "mypy>=2.3,<3",
]

[tool.uv.sources]
antipiracy-contracts = { path = "contracts", editable = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["crawler2"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "S", "BLE", "PT"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S608"]  # plain asserts; test-built CQL/DDL on test keyspaces
# CQL is built only from module constants; every value is a bind marker.
"crawler2/storage/scylla/**" = ["S608"]
# dev benchmark tooling: fixed docker/cqlsh invocations on our own keyspace names
"benchmarks/p2-storage/**" = ["S603", "S607", "S608"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["crawler2", "contracts/src", "tests", "benchmarks/p2-storage"]

# Producers construct contract models in code; unknown keyword arguments must
# fail type checking even though the models ignore unknown fields at runtime
# (consumer forward compatibility, ADR-009).
[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

[[tool.mypy.overrides]]
module = ["cassandra.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs the docker compose stack (run inside the app container or with CRAWLER2_* pointing at it)",
]
