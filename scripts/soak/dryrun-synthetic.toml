# Harness mechanics check with a generated workload (no services needed): ~2 minutes.
#   crawler2-soak dry-run scripts/soak/dryrun-synthetic.toml
# The verdict of a synthetic run is never M6 evidence (see docs/phases/p14-production-hardening/soak.md).
run_name = "dryrun-synthetic"
mode = "synthetic"
duration_h = 0.0334          # 2 minutes
sample_interval_s = 3
run_root = "var/soak"
required_stages = ["match.found"]

[thresholds]
max_interruptions = 1
max_interruption_gap_s = 60
min_series_coverage = 0.99
max_dependency_outage_s = 30
max_restarts_per_service = 1
min_disk_free_fraction = 0.05
max_queue_age_s = 600
max_event_lag_s = 600
max_retry_ratio = 0.5

[thresholds.growth."svc.rss_mb"]
max_slope_per_h = 50.0

[[collectors]]
name = "svc"
type = "synthetic"
[collectors.options.series.rss_mb]
kind = "sine"
base = 400
amp = 5
[collectors.options.series.queue_age]
kind = "const"
base = 12
[collectors.options.series.lag]
kind = "const"
base = 3
[collectors.options.series.disk_free]
kind = "const"
base = 0.5
[collectors.options.series.retries]
kind = "linear"
slope = 0.05
[collectors.options.series.done]
kind = "linear"
slope = 3
[[collectors.series]]
name = "up"
role = "up"
[[collectors.series]]
name = "rss_mb"
growth_watch = true
[[collectors.series]]
name = "queue_age"
role = "queue_age"
[[collectors.series]]
name = "lag"
role = "event_lag"
[[collectors.series]]
name = "disk_free"
role = "disk_free"
[[collectors.series]]
name = "retries"
role = "retry"
kind = "counter"
[[collectors.series]]
name = "done"
role = "work"
kind = "counter"

[[edges]]
name = "encode"
from_type = "encode.requested"
to_types = ["representation.ready"]
from_key = "payload.content.content_id"
to_key = "payload.representation.content_id"
effect_path = "payload.representation.representation_id"
grace_s = 60
